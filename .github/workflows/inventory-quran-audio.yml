name: Measure Quran audio catalogue sizes
on:
  workflow_dispatch:
    inputs:
      bayaan_catalogue_url:
        description: 'Optional public Bayaan reciter catalogue JSON endpoint (not base API URL)'
        required: false
        type: string
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query catalogues and HTTP file sizes
        env:
          BAYAAN_CATALOGUE_URL: ${{ inputs.bayaan_catalogue_url }}
        run: node scripts/inventory-quran-audio.cjs
      - name: Commit measured CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audio-inventory-mp3quran.csv docs/audio-inventory-bayaan.csv
          if ! git diff --cached --quiet; then
            git commit -m "docs: update measured Quran audio file sizes"
            git push
          fi
