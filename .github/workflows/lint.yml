name: Lint & Typecheck

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Prettier, ESLint, TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Prettier and ESLint are non-blocking while we work down pre-existing
      # formatting and lint debt. Both steps surface issues but don't fail the
      # job. TODO: once the codebase is clean, flip `continue-on-error: false`.
      #
      # Prettier: `npx prettier` resolves to node_modules/.bin/prettier, which
      # jest-snapshot-prettier hijacks (prettier 2.8.8). ESLint uses prettier 3, so
      # the two disagreed. Call the prettier 3 binary directly.
      - name: Prettier
        if: success() || failure()
        continue-on-error: true
        run: npm run format:check

      - name: ESLint
        if: success() || failure()
        continue-on-error: true
        run: npm run lint

      - name: TypeScript
        if: success() || failure()
        # The full-project typecheck needs a large heap; 4096 ran out of memory
        # on GitHub-hosted runners (exit 134), so use 8192.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx tsc --noEmit
